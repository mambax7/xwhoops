# SonarCloud configuration — OPT-IN security/SAST + quality analysis for this module.
#
# Enable in three steps:
#   1. Import the repository into SonarCloud (https://sonarcloud.io).
#   2. Set sonar.organization and sonar.projectKey below to match your SonarCloud project.
#   3. Add a SONAR_TOKEN secret in the repo's Actions secrets.
# The .github/workflows/sonar.yml workflow stays inert until SONAR_TOKEN is present.

sonar.organization=xoopsmodules27x
sonar.projectKey=XoopsModules27x_xwhoops
sonar.projectName=xwhoops

# Analyse PHP sources; keep vendored code, tooling, generated dirs, and tests out of "sources".
sonar.sources=.
sonar.exclusions=vendor/**,.build/**,node_modules/**,language/**,templates/**,templates_c/**,assets/**,docs/**,rector.php,.php-cs-fixer.dist.php,phpstan-bootstrap.php,stubs/**
sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php

# Coverage (optional): sonar.yml writes a clover report here when tests + a coverage driver exist.
sonar.php.coverage.reportPaths=.build/coverage/clover.xml

sonar.sourceEncoding=UTF-8

# --- XOOPS-convention false positives: permanently ignored ---
# SonarPHP's default naming/quality rules clash with mandated XOOPS conventions and with
# the shape of test doubles. Ignored here (in-repo, versioned) rather than per-issue in the
# UI, so the suppression is reviewable and survives every scan.
#
# NOTE: these properties are honoured ONLY by the CI scanner. SonarCloud's server-side
# Automatic Analysis ignores this file entirely -- disable Automatic Analysis
# (project -> Administration -> Analysis Method) so the CI scanner + this file take effect.
sonar.issue.ignore.multicriteria=x1,x2,x3,x4,x5

# S115: constant names must match ^[A-Z]..., but every XOOPS _MI_/_MA_/_AM_ constant
# begins with an underscore -- the rule can never pass for XOOPS language constants.
sonar.issue.ignore.multicriteria.x1.ruleKey=php:S115
sonar.issue.ignore.multicriteria.x1.resourceKey=**/*.php

# S100: function names must be camelCase, but XOOPS mandates snake_case lifecycle hooks
# (xoops_module_install_<dirname>, xoops_module_update_<dirname>, ...).
sonar.issue.ignore.multicriteria.x2.ruleKey=php:S100
sonar.issue.ignore.multicriteria.x2.resourceKey=**/*.php

# S1172 + S1186: a test double must match the real signature it stands in for, so its
# parameters are "unused" and its bodies are empty by design.
sonar.issue.ignore.multicriteria.x3.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.x3.resourceKey=tests/**
sonar.issue.ignore.multicriteria.x4.ruleKey=php:S1186
sonar.issue.ignore.multicriteria.x4.resourceKey=tests/**

# S1142: guard-clause early returns are the intentional style in the provider/install
# hooks; "too many return statements" is noise against that shape.
sonar.issue.ignore.multicriteria.x5.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.x5.resourceKey=**/*.php
